<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG Research Assistant</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.1rem; }
  .sub { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
  #api-url { width: 100%; padding: 0.4rem; font-size: 0.85rem; margin-bottom: 1rem; box-sizing: border-box; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  input[type="text"] { flex: 1; padding: 0.6rem 0.8rem; font-size: 1rem; }
  button { padding: 0.6rem 1.1rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .answer { padding: 1rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem; white-space: pre-wrap; }
  .sources { display: flex; flex-direction: column; gap: 0.6rem; }
  .source { border-left: 3px solid #888; padding: 0.4rem 0.8rem; font-size: 0.88rem; }
  .source a { font-weight: 600; }
  .score { color: #888; font-size: 0.78rem; }
  .loading { color: #888; font-style: italic; }
  .examples { font-size: 0.85rem; color: #666; margin-bottom: 1rem; }
  .examples button { font-size: 0.8rem; padding: 0.2rem 0.5rem; margin: 0.15rem; }
</style>
</head>
<body>
  <h1>RAG Research Assistant</h1>
  <div class="sub">Hybrid dense + BM25 retrieval over a curated set of ML papers (RAG, efficient inference, retrieval). Answers are grounded and cited from the retrieved excerpts.</div>

  <input id="api-url" type="text" placeholder="Backend URL, e.g. https://your-app.up.railway.app" />

  <div class="examples">
    Try:
    <button onclick="ask('How does PagedAttention reduce KV cache memory waste?')">PagedAttention</button>
    <button onclick="ask('What is the difference between RAG-Sequence and RAG-Token?')">RAG-Sequence vs RAG-Token</button>
    <button onclick="ask('What speedup does speculative decoding achieve?')">Speculative decoding</button>
  </div>

  <form id="query-form">
    <input id="question" type="text" placeholder="Ask a question about the papers..." autocomplete="off" />
    <button type="submit">Ask</button>
  </form>

  <div id="result"></div>

<script>
const form = document.getElementById('query-form');
const questionInput = document.getElementById('question');
const resultDiv = document.getElementById('result');
const apiUrlInput = document.getElementById('api-url');

apiUrlInput.value = localStorage.getItem('rag_api_url') || '';
apiUrlInput.addEventListener('change', () => localStorage.setItem('rag_api_url', apiUrlInput.value));

function ask(text) {
  questionInput.value = text;
  form.requestSubmit();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = questionInput.value.trim();
  const apiUrl = apiUrlInput.value.trim().replace(/\/$/, '');
  if (!question) return;
  if (!apiUrl) {
    resultDiv.innerHTML = '<p class="loading">Set the backend URL above first.</p>';
    return;
  }

  resultDiv.innerHTML = '<p class="loading">Retrieving and generating…</p>';
  const submitBtn = form.querySelector('button');
  submitBtn.disabled = true;

  try {
    const res = await fetch(`${apiUrl}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const sourcesHtml = data.sources.map(s => `
      <div class="source">
        <a href="${s.doc_url}" target="_blank" rel="noopener">${s.doc_title}</a>
        <span class="score">score ${s.fused_score}</span>
        <div>${s.text.slice(0, 220)}${s.text.length > 220 ? '…' : ''}</div>
      </div>
    `).join('');

    resultDiv.innerHTML = `
      <div class="answer">${data.answer}</div>
      <div class="sources">${sourcesHtml}</div>
    `;
  } catch (err) {
    resultDiv.innerHTML = `<p class="loading">Error reaching backend: ${err.message}</p>`;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
